name: sellora

windows: 
  browser:
    command: brave-browser
    class: brave-browser
    workspace: 1
  editor:
    command: code ~/Documents/neer/sellora
    class: code
    workspace: 2
    directory: ~/Documents/neer/sellora
  spotify: 
    command: spotify
    class: spotify
    workspace: 10
  postman:
    command: postman
    class: postman
    workspace: 5
  antigravity:
    command: antigravity
    class: editor
    workspace: 4
  

terminals:
  defaults:
    app: kitty
    class: kitty
    workspace: 3
    directory: ~/Documents/neer/sellora
    title_prefix: doom:sellora
  entries:
    shell: {}
    server: {}
    logs: {}
    packages: {}
