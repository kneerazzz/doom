name: sellora

windows: 
  browser:
    command: brave-browser
    class: brave-browser
    workspace: 4
  editor:
    command: code ~/Documents/neer/sellora
    class: code
    workspace: 5
    directory: ~/Documents/neer/sellora
  spotify: 
    command: spotify
    class: spotify
    workspace: 10
  postman:
    command: postman
    class: postman
    workspace: 6
  antigravity:
    command: antigravity
    class: editor
    workspace: 2
  

terminals:
  defaults:
    app: kitty
    class: kitty
    workspace: 3
    directory: ~/Documents/neer/sellora
    title_prefix: doom:sellora
  entries:
    root:
      directory: ~/Documents/neer/sellora
    frontend:
      directory: ~/Documents/neer/sellora/apps/web
    backend:
      directory: ~/Documents/neer/sellora/apps/server
    logs:
      directory: ~/Documents/neer/sellora/apps/copilot

